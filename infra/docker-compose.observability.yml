# Profile de observabilidade — Prometheus + Grafana
# Uso: docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability up -d
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: saas_prometheus
    profiles: [observability]
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - frontend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: saas_grafana
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - frontend

volumes:
  prometheus_data:
  grafana_data:
