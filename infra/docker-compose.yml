# Stack completo — desenvolvimento local
# Uso: docker compose --env-file .env up -d --build
name: saas_vendas

x-api-env: &api-env
  APP_NAME: ${APP_NAME:-SaaS Vendas}
  APP_ENV: ${APP_ENV:-local}
  # APP_KEY e JWT_SECRET: omitidos aqui no dev — Laravel usa saas_vendas_api/.env (bind mount).
  # Em staging/prod, defina em infra/.env ou nos overrides de compose.
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:8080}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  LOG_CHANNEL: stack
  LOG_STACK: single,daily
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  REDIS_PORT: 6379
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: array
  JWT_TTL: ${JWT_TTL:-60}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-20160}

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: saas_gateway
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api-nginx:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - frontend

  web:
    build:
      context: ${WEB_PATH:-..}
      dockerfile: infra/docker/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-SaaS Vendas}
    container_name: saas_web
    restart: unless-stopped
    networks:
      - frontend

  api:
    build:
      context: ${API_PATH:-../../saas_vendas_api}
      dockerfile: ../saas_vendas_web/infra/docker/api/Dockerfile
      target: ${API_BUILD_TARGET:-development}
    container_name: saas_api
    restart: unless-stopped
    working_dir: /var/www/html
    environment: *api-env
    volumes:
      - ${API_PATH:-../../saas_vendas_api}:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-saas.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan health:check --no-interaction || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    networks:
      - backend
      - frontend

  api-nginx:
    image: nginx:1.27-alpine
    container_name: saas_api_nginx
    restart: unless-stopped
    volumes:
      - ${API_PATH:-../../saas_vendas_api}:/var/www/html:ro
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend

  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres
    restart: unless-stopped
    ports:
      - "${DB_PUBLISH_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${API_PATH:-../../saas_vendas_api}/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: unless-stopped
    command: >
      sh -c "redis-server --appendonly yes
      $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  queue:
    build:
      context: ${API_PATH:-../../saas_vendas_api}
      dockerfile: ../saas_vendas_web/infra/docker/api/Dockerfile
      target: ${API_BUILD_TARGET:-development}
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --memory=256
    environment: *api-env
    volumes:
      - ${API_PATH:-../../saas_vendas_api}:/var/www/html
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  scheduler:
    build:
      context: ${API_PATH:-../../saas_vendas_api}
      dockerfile: ../saas_vendas_web/infra/docker/api/Dockerfile
      target: ${API_BUILD_TARGET:-development}
    container_name: saas_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    environment: *api-env
    volumes:
      - ${API_PATH:-../../saas_vendas_api}:/var/www/html
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  backup:
    image: postgres:16-alpine
    container_name: saas_backup
    restart: unless-stopped
    profiles: [backup]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DB_DATABASE}
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backup_data:/backups
      - ./scripts/backup-entrypoint.sh:/backup-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/backup-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  backup_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
