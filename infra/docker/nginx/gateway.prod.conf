# Gateway — produção (TLS, rate limit, cache estático)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

upstream api_backend {
    least_conn;
    server api-nginx:80 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream web_frontend {
    server web:80;
    keepalive 32;
}

# Redirect HTTP → HTTPS (descomente com certificados em docker/nginx/ssl)
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;
    server_name _;

    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers on;

    client_max_body_size 20M;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    location /health {
        access_log off;
        return 200 "production-ok\n";
    }

    location /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://api_backend;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api_limit burst=120 nodelay;
        proxy_pass http://api_backend;
        include /etc/nginx/proxy_params.conf;
    }

    location /up {
        proxy_pass http://api_backend;
        access_log off;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
